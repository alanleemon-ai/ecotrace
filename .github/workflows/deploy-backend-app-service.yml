name: Deploy Backend - Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "backend_clean/**"
      - "config/**"
      - "requirements.txt"
      - "runtime.txt"
      - "startup.sh"
      - ".github/workflows/deploy-backend-app-service.yml"
  # Run the checks on pull requests too; the deploy job below is skipped for them.
  pull_request:
    paths:
      - "backend_clean/**"
      - "config/**"
      - "requirements.txt"
      - "runtime.txt"
      - "startup.sh"
      - ".github/workflows/deploy-backend-app-service.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PACKAGE_PATH: backend-package

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend_clean/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_clean/requirements.txt

      - name: Compile backend
        run: python -m compileall backend_clean

      # The suite needs no database or API keys. It imports as
      # backend_clean.app..., so it must run from the repository root.
      - name: Run tests
        run: python -m pytest backend_clean/tests -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          mkdir -p "${PACKAGE_PATH}"
          rsync -av \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude "backend_clean/.env" \
            --exclude "backend_clean/uploads" \
            --exclude "backend_clean/cache" \
            --exclude "backend_clean/outbox" \
            backend_clean startup.sh requirements.txt runtime.txt config "${PACKAGE_PATH}/"

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: ${{ env.PACKAGE_PATH }}
